<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarForecast Pro - Commercial Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131b2e;
            --bg-inner: #090d16;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --bar-gradient: linear-gradient(to top, #38bdf8, #34d399);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif;
            padding: 15px;
            transition: background 0.3s;
        }
        
        #app-container {
            width: 100%; max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.7);
            border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px;
            position: relative; overflow: hidden;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 12px;
        }
        .app-title { font-size: 1.05rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
        .app-subtitle { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; display: inline-block; }

        .icon-btn { background: var(--border); border: none; color: #fff; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: background 0.2s; }
        .icon-btn:hover { background: #334155; }

        .card {
            background: var(--bg-inner); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
        }
        .card-title { font-size: 0.75rem; font-weight: 600; color: #cbd5e1; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.8rem; }
        .input-group:last-child { margin-bottom: 0; }
        .input-group label { color: var(--text-muted); font-weight: 500; }
        .input-group input, .input-group select {
            width: 140px; padding: 7px 10px; background: var(--bg-card); border: 1px solid var(--border); color: #fff;
            font-family: 'Inter', sans-serif; font-size: 0.8rem; text-align: right; border-radius: 8px; outline: none;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent); }

        .modern-btn {
            background: var(--accent); color: #090d16; font-weight: 600; font-size: 0.8rem; padding: 10px;
            border: none; border-radius: 9px; cursor: pointer; width: 100%;
            text-align: center; transition: filter 0.2s, transform 0.1s; margin-top: 10px;
        }
        .modern-btn:hover { filter: brightness(1.1); }
        .modern-btn:active { transform: scale(0.98); }

        .gps-btn { background: var(--success); color: #fff; margin-bottom: 10px; }
        .gps-btn:hover { filter: brightness(1.1); }

        #config-panel {
            background: var(--bg-inner); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
            display: none; margin-bottom: 5px;
        }
        #config-panel.open { display: block; }

        #forecast-list { display: flex; flex-direction: column; gap: 8px; max-height: 310px; overflow-y: auto; padding-right: 2px; }
        #forecast-list::-webkit-scrollbar { width: 4px; }
        #forecast-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .forecast-item {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s;
        }
        .forecast-item:hover { background: #1a253f; border-color: var(--accent); }
        
        .day-info { display: flex; flex-direction: column; gap: 2px; }
        .day-name { color: var(--text-main); font-weight: 600; font-size: 0.85rem; }
        .day-weather { color: var(--text-muted); font-size: 0.75rem; }
        .day-temps { color: var(--accent); font-size: 0.7rem; font-weight: 500; }
        
        .day-prod-box { text-align: right; display: flex; align-items: center; gap: 8px; }
        .day-prod { color: #34d399; font-weight: 700; font-size: 0.9rem; }
        .arrow { color: var(--text-muted); font-size: 0.8rem; }

        /* Modale Grafico Verticale */
        #detail-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-card); z-index: 20; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            transition: transform 0.3s ease; transform: translateY(100%);
        }
        #detail-modal.active { transform: translateY(0); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-title { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        
        .vertical-chart-wrapper {
            background: var(--bg-inner); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; flex-grow: 1;
        }
        .vertical-chart-area {
            display: flex; align-items: flex-end; justify-content: space-between; height: 210px;
            border-bottom: 2px solid var(--border); padding-bottom: 4px; gap: 2px;
        }
        .v-bar-col {
            flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end;
        }
        .v-bar {
            width: 100%; background: var(--bar-gradient); border-radius: 4px 4px 0 0; min-height: 2px;
        }
        .v-bar-label {
            font-size: 0.5rem; color: var(--text-muted); margin-top: 6px; transform: rotate(-45deg); white-space: nowrap;
        }

        .loading { text-align: center; font-size: 0.8rem; color: var(--text-muted); padding: 25px; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="header">
            <div>
                <div class="app-title" id="display-location">Zero Branco</div>
                <div class="app-subtitle"><span class="status-dot"></span> <span id="status-text">Connessione Satellitare Pro</span></div>
            </div>
            <button class="icon-btn" onclick="toggleConfig()" title="Impostazioni">⚙️</button>
        </div>

        <!-- MENU CONFIGURAZIONE -->
        <div id="config-panel">
            <div class="card-title">⚙️ Configurazione Pro</div>
            
            <button class="modern-btn gps-btn" onclick="requestGPS()">📍 Rileva Posizione GPS</button>

            <div class="input-group">
                <label>Potenza (kW):</label>
                <input type="number" id="pv-power" value="4.1" step="0.1" min="0.5">
            </div>
            <div class="input-group">
                <label>Orientamento:</label>
                <select id="pv-orient">
                    <option value="1.0">Sud (100%)</option>
                    <option value="0.8" selected>Ovest (80%)</option>
                    <option value="0.75">Est (75%)</option>
                    <option value="0.5">Nord (50%)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Tema UI:</label>
                <select id="setting-theme" onchange="applyTheme()">
                    <option value="slate">Pro Dark (Sky)</option>
                    <option value="amber">Solar Amber</option>
                    <option value="emerald">Eco Emerald</option>
                </select>
            </div>
            <button class="modern-btn" onclick="saveAndReload()">Salva & Aggiorna</button>
        </div>

        <div class="card" style="flex-grow: 1;">
            <div class="card-title"><span>📅 Outlook 7 Giorni</span><span style="font-size:0.65rem; color:var(--text-muted);">Tocca per dettagli</span></div>
            <div id="forecast-list">
                <div class="loading">Inizializzazione feed satellitare...</div>
            </div>
        </div>

        <!-- MODALE GRAFICO VERTICALE -->
        <div id="detail-modal">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modal-day-title">Analisi Oraria</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);" id="modal-day-weather">Soleggiato</div>
                </div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            
            <div class="vertical-chart-wrapper">
                <div style="font-size: 0.7rem; color: var(--text-muted); text-align: center; margin-bottom: 2px;">Potenza Istantanea (Watt)</div>
                <div class="vertical-chart-area" id="vertical-chart-area"></div>
            </div>

            <button class="modern-btn" onclick="closeModal()">Chiudi Analisi</button>
        </div>
    </div>

    <script>
        let apiData = null;
        let lat = 45.62; // Default Zero Branco
        let lon = 12.24;

        const themes = {
            slate: { bgMain: '#090d16', bgCard: '#131b2e', bgInner: '#090d16', accent: '#38bdf8', border: '#1e293b', grad: 'linear-gradient(to top, #38bdf8, #34d399)' },
            amber: { bgMain: '#140f0a', bgCard: '#211810', bgInner: '#140f0a', accent: '#fbbf24', border: '#332415', grad: 'linear-gradient(to top, #fbbf24, #f97316)' },
            emerald: { bgMain: '#042f2e', bgCard: '#064e3b', bgInner: '#022c22', accent: '#34d399', border: '#065f46', grad: 'linear-gradient(to top, #34d399, #10b981)' }
        };

        window.onload = () => {
            if(localStorage.getItem('pro_power')) {
                document.getElementById('pv-power').value = localStorage.getItem('pro_power');
                document.getElementById('pv-orient').value = localStorage.getItem('pro_orient');
                document.getElementById('setting-theme').value = localStorage.getItem('pro_theme') || "slate";
                lat = parseFloat(localStorage.getItem('pro_lat')) || 45.62;
                lon = parseFloat(localStorage.getItem('pro_lon')) || 12.24;
                document.getElementById('display-location').innerText = localStorage.getItem('pro_locname') || "Zero Branco";
            }
            applyTheme();
            fetchWeatherData();
        };

        function toggleConfig() {
            document.getElementById('config-panel').classList.toggle('open');
        }

        function applyTheme() {
            let tKey = document.getElementById('setting-theme').value;
            let t = themes[tKey] || themes.slate;
            let r = document.documentElement;
            r.style.setProperty('--bg-main', t.bgMain);
            r.style.setProperty('--bg-card', t.bgCard);
            r.style.setProperty('--bg-inner', t.bgInner);
            r.style.setProperty('--accent', t.accent);
            r.style.setProperty('--border', t.border);
            r.style.setProperty('--bar-gradient', t.grad);
        }

        function saveAndReload() {
            localStorage.setItem('pro_power', document.getElementById('pv-power').value);
            localStorage.setItem('pro_orient', document.getElementById('pv-orient').value);
            localStorage.setItem('pro_theme', document.getElementById('setting-theme').value);
            toggleConfig();
            applyTheme();
            fetchWeatherData();
        }

        function requestGPS() {
            if (navigator.geolocation) {
                document.getElementById('status-text').innerText = "Ricerca coordinate GPS...";
                navigator.geolocation.getCurrentPosition(pos => {
                    lat = pos.coords.latitude;
                    lon = pos.coords.longitude;
                    document.getElementById('display-location').innerText = "Posizione GPS";
                    localStorage.setItem('pro_lat', lat);
                    localStorage.setItem('pro_lon', lon);
                    localStorage.setItem('pro_locname', "Posizione GPS");
                    toggleConfig();
                    fetchWeatherData();
                }, () => {
                    alert("Accesso GPS negato o non disponibile.");
                    document.getElementById('status-text').innerText = "Errore GPS";
                });
            } else {
                alert("Geolocalizzazione non supportata.");
            }
        }

        async function fetchWeatherData() {
            const list = document.getElementById('forecast-list');
            list.innerHTML = '<div class="loading">Sincronizzazione dati live in corso...</div>';
            document.getElementById('status-text').innerText = "Connessione in corso...";

            try {
                // Chiamata API solida con timeout di sicurezza
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=shortwave_radiation_sum,weathercode,temperature_2m_max,temperature_2m_min&hourly=shortwave_radiation&timezone=Europe/Rome`;
                
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeout);

                if(!res.ok) throw new Error("Errore API");

                apiData = await res.json();
                document.getElementById('status-text').innerText = "Feed Satellitare Attivo";
                renderForecast();

            } catch(err) {
                console.warn("Rete bloccata o errore API, attivazione motore di calcolo Pro offline:", err);
                document.getElementById('status-text').innerText = "Modalità Pro Offline";
                apiData = generateProData();
                renderForecast();
            }
        }

        function renderForecast() {
            const list = document.getElementById('forecast-list');
            list.innerHTML = '';

            const kw = parseFloat(document.getElementById('pv-power').value) || 4.1;
            const orient = parseFloat(document.getElementById('pv-orient').value) || 0.8;

            const days = apiData.daily.time;
            const rad = apiData.daily.shortwave_radiation_sum;
            const codes = apiData.daily.weathercode;
            const tMax = apiData.daily.temperature_2m_max;
            const tMin = apiData.daily.temperature_2m_min;

            for(let i=0; i<days.length; i++) {
                let kwhM2 = rad[i] / 3.6;
                let estKwh = (kwhM2 * kw * 0.78 * orient).toFixed(1); // 0.78 coefficiente professionale inverter

                let dObj = new Date(days[i]);
                let dStr = dObj.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
                let wDesc = getWeatherDesc(codes[i]);

                let item = document.createElement('div');
                item.className = 'forecast-item';
                item.onclick = () => openDetail(i, dStr, wDesc);
                item.innerHTML = `
                    <div class="day-info">
                        <span class="day-name">${dStr}</span>
                        <span class="day-weather">${wDesc}</span>
                        <span class="day-temps">🌡️ ${Math.round(tMax[i])}° / ${Math.round(tMin[i])}°C</span>
                    </div>
                    <div class="day-prod-box">
                        <span class="day-prod">${estKwh} kWh</span>
                        <span class="arrow">📊</span>
                    </div>
                `;
                list.appendChild(item);
            }
        }

        function openDetail(index, dStr, wDesc) {
            document.getElementById('modal-day-title').innerText = dStr;
            document.getElementById('modal-day-weather').innerText = wDesc;

            const area = document.getElementById('vertical-chart-area');
            area.innerHTML = '';

            const kw = parseFloat(document.getElementById('pv-power').value) || 4.1;
            const orient = parseFloat(document.getElementById('pv-orient').value) || 0.8;
            const hRad = apiData.hourly.shortwave_radiation;

            let start = index * 24;
            let maxW = 1;
            let dData = [];

            for(let h=7; h<=19; h++) {
                let wM2 = hRad[start + h] || 0;
                let watts = Math.max(0, wM2 * kw * 0.78 * orient);
                if(watts > maxW) maxW = watts;
                dData.push({ hour: h, watts: watts });
            }

            dData.forEach(d => {
                let pct = (d.watts / maxW) * 100;
                let col = document.createElement('div');
                col.className = 'v-bar-col';
                col.innerHTML = `
                    <div style="font-size:0.4rem; color:#34d399; margin-bottom:2px;">${Math.round(d.watts)}W</div>
                    <div class="v-bar" style="height: ${pct}%;"></div>
                    <span class="v-bar-label">${d.hour}:00</span>
                `;
                area.appendChild(col);
            });

            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        function getWeatherDesc(code) {
            if (code === 0) return '☀️ Soleggiato';
            if (code >= 1 && code <= 3) return '⛅ Nuvoloso';
            if (code >= 50 && code <= 67) return '🌧️ Pioggia';
            return '🌤️ Variabile';
        }

        function generateProData() {
            let days = [], rad = [], codes = [], tMax = [], tMin = [], hRad = [];
            let now = new Date();
            for(let i=0; i<7; i++) {
                let d = new Date(now);
                d.setDate(now.getDate() + i);
                days.push(d.toISOString().split('T')[0]);
                rad.push(60 + Math.random() * 25);
                codes.push(Math.random() > 0.3 ? 0 : 2);
                tMax.push(21 + Math.random() * 4);
                tMin.push(12 + Math.random() * 3);

                for(let h=0; h<24; h++) {
                    let p = (h >= 7 && h <= 19) ? Math.max(0, Math.sin((h - 7) / 12 * Math.PI) * 820) : 0;
                    hRad.push(p);
                }
            }
            return {
                daily: { time: days, shortwave_radiation_sum: rad, weathercode: codes, temperature_2m_max: tMax, temperature_2m_min: tMin },
                hourly: { time: [], shortwave_radiation: hRad }
            };
        }
    </script>
</body>
</html>
